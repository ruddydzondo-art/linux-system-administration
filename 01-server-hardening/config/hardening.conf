# Paramètres de durcissement SSH
SSH_PORT="22"
ALLOW_USERS="ruddy"
MAX_AUTH_TRIES="3"

# Paramètres du pare-feu (services autorisés séparés par un espace)
ALLOWED_SERVICES="ssh"

# Politique des mots de passe (/etc/login.defs)
PASS_MAX_DAYS="90"
PASS_MIN_DAYS="1"
PASS_WARN_AGE="14"
PASS_MIN_LEN="12"
